<!doctype html><html lang="vi"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>LivingPQ - Cầu Hôn Visual Reset - 3D Review</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;width:100%;height:100%;background:#a7858b;color:white;font-family:system-ui,-apple-system,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#vignette{position:fixed;inset:0;background:linear-gradient(#172b3888,transparent 24%,transparent 74%,#0a25339e);pointer-events:none}
#head{position:fixed;top:16px;left:20px;text-shadow:0 2px 8px #1a273b;max-width:67%;pointer-events:none}
#head small{font-size:10px;letter-spacing:.18em;color:#ffe3c5}
#head h1{font-size:clamp(19px,4vw,29px);letter-spacing:-.03em;margin:4px 0}
#head p{font-size:11px;line-height:1.45;margin:4px 0;color:#f8dfd0}
#controls{position:fixed;bottom:20px;left:15px;display:flex;flex-wrap:wrap;gap:8px;z-index:3}
button{border-radius:50px;border:1px solid #ffffffad;background:#163b47bf;color:white;font:700 12px system-ui;padding:11px 17px;cursor:pointer;backdrop-filter:blur(12px)}
button.selected{background:#f5dfb6;color:#23424a}
#stats{position:fixed;bottom:76px;left:20px;font-size:10px;color:#fff2dd;text-shadow:0 1px 5px #17394b}
#notice{position:fixed;top:20px;right:18px;text-align:right;font-size:10px;max-width:28%;color:#fff2e3;text-shadow:0 2px 4px #274250}
#loading{position:fixed;inset:0;background:#264451;display:grid;place-content:center;text-align:center;font-weight:800;font-size:23px;z-index:8}
#loading small{font-size:13px;font-weight:400}
@media(max-width:600px){#head{left:12px;top:11px}#head h1{font-size:19px}#head small{font-size:8px}#head p{font-size:10px}#controls{bottom:10px;left:9px;right:9px;gap:5px}button{font-size:10px;padding:10px 11px}#notice{top:auto;bottom:90px;max-width:52%;font-size:9px}#stats{bottom:85px;left:10px;font-size:9px}}
</style></head><body>
<canvas id="world" aria-label="Nghiên cứu 3D Sunset Town, Cầu Hôn, sân khấu"></canvas><div id="vignette"></div>
<header id="head"><small>OPEN PHÚ QUỐC · VISUAL RESET LAB</small><h1>Sunset Town + Cầu Hôn</h1>
<p>3D WebGL thực · Kiến trúc nghiên cứu theo ảnh thật · Chưa hiệu chỉnh trắc địa.</p></header>
<div id="notice">BẢN THỬ V2 · CHƯA DUYỆT 70%<br/>KHÔNG PHẢI ẢNH AI HAY GAMEPLAY</div>
<div id="stats">Đang tạo mô hình...</div>
<nav id="controls"><button data-view="hillside" class="selected">Nhìn từ cao</button>
<button data-view="promenade">Từ quảng trường</button><button data-view="bridge">Góc Cầu Hôn</button></nav>
<div id="loading">Living Phú Quốc<small>Đang dựng cảnh 3D WebGL...</small></div>
<script src="./bundle.js"></script>
</body></html>
